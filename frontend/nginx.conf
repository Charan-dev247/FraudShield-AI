server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: the browser talks to nginx, nginx talks to the backend container.
  location /api/ { proxy_pass http://backend:8000; }
  location /health { proxy_pass http://backend:8000; }

  # React Router: unknown paths fall back to index.html
  location / { try_files $uri /index.html; }
}
