# Run the whole stack:  docker compose up --build
# Prereq: train once so backend/artifacts/ exists (see README), then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud          # local demo only: use a secret manager in real deployments
      POSTGRES_DB: fraudshield
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraudshield"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://fraud:fraud@db:5432/fraudshield
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
